  }
  function run() {
    var $ = function (s) { return document.querySelector(s); };
    [$('.logo'), $('.links'), $('.xbtn'), $('.nav .pill'), $('.menu-btn')].forEach(function (el, i) {
      play(el, [{ opacity: 0 }, { opacity: 1 }], { delay: 60 + i * 70, duration: 600, easing: SOFT });

    play($('.headline'), [{ opacity: 0, filter: 'blur(14px)', transform: 'scale(1.04)' }, { opacity: 1, filter: 'blur(0px)', transform: 'scale(1)' }], { delay: 700, duration: 1000, easing: EXPO });

    Promise.all(anims.map(function (a) { return a.finished.catch(function () {}); })).then(finish);
