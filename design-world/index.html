<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Design World — Explore New Ideas</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
<style>
:root { --bg:#000; --fg:#fff; --pad-x: clamp(20px, 6.95vw, 120px) }
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0 }
html, body { height:100%; background:#000; color:#fff; font-family:'Poppins',sans-serif; -webkit-font-smoothing:antialiased; overflow-x:hidden }

.hero { position:relative; width:100%; height:100vh; height:100svh; min-height:520px; overflow:hidden; background:#000 }
#scene { position:absolute; inset:0; width:100%; height:100%; display:block; cursor:grab; touch-action:none }
#scene.dragging { cursor:grabbing }
.ui { position:absolute; inset:0; pointer-events:none; z-index:2 }
.ui a, .ui button { pointer-events:auto }
.sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap }

/* nav */
.nav { position:absolute; top:clamp(24px,4.7vh,40px); left:var(--pad-x); right:var(--pad-x); display:flex; align-items:center; justify-content:space-between }
.logo { display:flex; align-items:center; gap:8px; color:#fff; text-decoration:none; font-size:15px; letter-spacing:-0.01em }
.logo-mark { width:20px; height:40px; background:#fff; border-radius:0 20px 20px 0 }
.logo b { font-weight:700 }
.logo span { font-weight:400 }
.nav-links { display:flex; gap:clamp(20px,4.1vw,60px); list-style:none }
.nav-links a { color:#fff; text-decoration:none; font-size:15px; font-weight:500; position:relative; cursor:pointer }
.nav-links a::after { content:''; position:absolute; left:0; right:0; bottom:-4px; height:1px; background:currentColor; transform:scaleX(0); transform-origin:right; transition:transform .35s ease }
.nav-links a:hover::after { transform:scaleX(1); transform-origin:left }

/* arrows */
.arrows { position:absolute; top:18.9%; left:76.7%; display:flex; gap:32px; transform:translate(-19px,-50%) }
.arrow { width:38px; height:38px; border-radius:50%; border:2.5px solid #fff; background:transparent; color:#fff; display:grid; place-items:center; cursor:pointer; transition:background .25s, color .25s }
.arrow svg { width:18px; height:18px }
.arrow:hover { background:#fff; color:#000 }

/* pagination dots */
.dots { position:absolute; right:calc(var(--pad-x) - 7px); top:49.4%; transform:translateY(-50%); display:flex; flex-direction:column; gap:33px }
.dot { width:14px; height:14px; border-radius:50%; border:2px solid #fff; background:#fff; cursor:pointer; transition:background .25s }
.dot.active { background:transparent }

/* tagline */
.tagline { position:absolute; left:var(--pad-x); bottom:clamp(40px,7.5vh,70px); font-size:clamp(24px,2.65vw,44px); line-height:1.2; font-weight:300; letter-spacing:-0.01em }
.tagline strong { font-weight:700; display:block }

/* cta row */
.cta-row { position:absolute; left:45.6%; right:-1vw; top:88.7%; transform:translateY(-50%); display:flex; align-items:center }
.cta { flex:none; padding:0 15px; height:48px; display:inline-flex; align-items:center; border:1.5px solid rgba(255,255,255,.85); border-radius:6px; background:rgba(0,0,0,.15); color:#fff; font-size:14px; font-weight:400; text-decoration:none; cursor:pointer; transition:background .25s, color .25s }
.cta:hover { background:#fff; color:#000 }
.cta-line { flex:1; height:1.5px; background:rgba(255,255,255,.8); min-width:40px }
.count { flex:none; font-size:clamp(140px,19.8vw,360px); font-weight:400; line-height:1; letter-spacing:-0.02em; color:transparent; -webkit-text-stroke:1.5px rgba(255,255,255,.9); transform:translateY(6%); user-select:none }

/* loader */
.loader { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); font-size:12px; letter-spacing:.2em; text-transform:uppercase; opacity:.6; transition:opacity .6s }
.loader.done { opacity:0 }

/* responsive */
@media (max-width:900px), (max-aspect-ratio:1/1) {
  .arrows { left:auto; right:var(--pad-x); top:15%; transform:translateY(-50%); gap:14px }
  .tagline { bottom:clamp(150px,20vh,220px) }
  .cta-row { left:var(--pad-x); right:-3vw; top:auto; bottom:24px; transform:none }
  .count { font-size:clamp(120px,22vw,200px) }
}
@media (max-width:640px) {
  .nav-links { gap:16px }
  .nav-links a, .logo { font-size:13px }
  .dots { gap:20px; right:16px }
  .dot { width:10px; height:10px }
  .cta-row { right:-8vw }
  .count { font-size:120px }
}
@media (max-width:420px) { .nav-links li:nth-child(2) { display:none } }
</style>
</head>
<body>
<section class="hero" id="hero">
  <canvas id="scene" aria-label="Rotatable glass cube. Drag to rotate."></canvas>
  <div class="ui">
    <h1 class="sr-only">Explore New Ideas</h1>
    <header class="nav">
      <a href="#" class="logo"><i class="logo-mark"></i><b>Design</b><span>World</span></a>
      <ul class="nav-links"><li><a>Home</a></li><li><a>Portfolio</a></li><li><a>Contact Us</a></li></ul>
    </header>
    <div class="arrows">
      <button class="arrow" id="prev" type="button" aria-label="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
      <button class="arrow" id="next" type="button" aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </div>
    <nav class="dots" aria-label="Slides"><button class="dot" type="button" aria-label="Slide 1"></button><button class="dot active" type="button" aria-label="Slide 2"></button><button class="dot" type="button" aria-label="Slide 3"></button></nav>
    <p class="tagline">Let's Build the<br>Future of <strong>Design.</strong></p>
    <div class="cta-row">
      <a href="#" class="cta">Explore Now</a>
      <span class="cta-line"></span>
      <span class="count" aria-hidden="true">07</span>
    </div>
    <div class="loader" id="loader">Loading model</div>
  </div>
</section>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { mergeVertices, mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const MODEL_URL = 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260929_212926_92423081-b0e4-4f5a-b650-14af6c05c058.glb';

const canvas = document.getElementById('scene');
const loaderEl = document.getElementById('loader');

/* ---------------- renderer / camera ---------------- */
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setClearColor(0x000000, 1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

const FOV = 30;
const camera = new THREE.PerspectiveCamera(FOV, 1, 0.1, 100);
camera.position.set(0, 0, 10);
camera.lookAt(0, 0, 0);

const scene = new THREE.Scene();
const pivot = new THREE.Group();     // screen position + scale
const spinner = new THREE.Group();   // rotation
spinner.rotation.set(-0.42, 0.62, 0.18);
pivot.add(spinner);
scene.add(pivot);

const isMobile = () => (innerWidth < 768) || (innerWidth / innerHeight < 1);

/* ---------------- background headline: 2D canvas -> texture ---------------- */
const textCanvas = document.createElement('canvas');
const tctx = textCanvas.getContext('2d');
const bgTexture = new THREE.CanvasTexture(textCanvas);
bgTexture.colorSpace = THREE.SRGBColorSpace;
bgTexture.minFilter = THREE.LinearFilter;
bgTexture.magFilter = THREE.LinearFilter;
bgTexture.generateMipmaps = false;

function drawHeadline() {
  const dpr = renderer.getPixelRatio();
  const W = innerWidth, H = innerHeight;
  textCanvas.width = Math.round(W * dpr);
  textCanvas.height = Math.round(H * dpr);
  tctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  tctx.fillStyle = '#000';
  tctx.fillRect(0, 0, W, H);

  const mobile = isMobile();
  let fs = Math.min(H * 0.21, W * (mobile ? 0.21 : 0.118));
  const lines = ['Explore', 'New', 'Ideas'];
  tctx.font = `800 ${fs}px Poppins`;
  const widest = Math.max(...lines.map(l => tctx.measureText(l).width));
  const maxW = W * (mobile ? 0.9 : 0.5);
  if (widest > maxW) { fs *= maxW / widest; tctx.font = `800 ${fs}px Poppins`; }

  const cx = W * (mobile ? 0.5 : 0.505);
  const cy = H * (mobile ? 0.45 : 0.468);
  const gap = fs * 1.07, cap = fs * 0.7;
  tctx.fillStyle = '#e9e9e9';
  tctx.textAlign = 'center';
  tctx.textBaseline = 'alphabetic';
  lines.forEach((line, i) => tctx.fillText(line, cx, cy + cap / 2 + (i - 1) * gap));
  bgTexture.needsUpdate = true;
}

const bgScene = new THREE.Scene();
const bgQuad = new THREE.Mesh(
  new THREE.PlaneGeometry(2, 2),
  new THREE.ShaderMaterial({
    uniforms: { uTex: { value: bgTexture } },
    vertexShader: `
      varying vec2 vUv;
      void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
    fragmentShader: `
      uniform sampler2D uTex; varying vec2 vUv;
      void main(){
        gl_FragColor = texture2D(uTex, vUv);
        #include <colorspace_fragment>
      }`,
    depthTest: false,
    depthWrite: false
  })
);
bgQuad.frustumCulled = false;
bgScene.add(bgQuad);

/* ---------------- glass material ---------------- */
const glassVertex = `
  varying vec3 vNormal; varying vec3 vEye;
  void main(){
    vec4 worldPos = modelMatrix * vec4(position, 1.0);
    vec4 mvPos = viewMatrix * worldPos;
    gl_Position = projectionMatrix * mvPos;
    vNormal = normalize(normalMatrix * normal);
    vEye = normalize(mvPos.xyz);
  }`;
const glassFragment = `
  uniform sampler2D uTexture; uniform vec2 uResolution;
  uniform float uIorR, uIorY, uIorG, uIorC, uIorB, uIorP;
  uniform float uRefractPower, uChromatic, uSaturation, uShininess, uDiffuseness, uFresnelPower, uBackside;
  uniform vec3 uLight;
  varying vec3 vNormal; varying vec3 vEye;
  const int LOOP = 16;

  float specular(vec3 light, float shininess, float diffuseness, vec3 n, vec3 eye){
    vec3 lightVec = normalize(-light);
    vec3 viewVec = -eye;
    vec3 halfVec = normalize(viewVec + lightVec);
    float kSpecular = pow(max(dot(n, halfVec), 0.0), shininess);
    float kDiffuse = max(0.0, dot(n, lightVec)) * diffuseness;
    return kSpecular + kDiffuse;
  }

  void main(){
    vec2 uv = gl_FragCoord.xy / uResolution;
    vec3 n = normalize(vNormal);
    if (uBackside > 0.5) n = -n;
    vec3 eye = normalize(vEye);
    vec3 color = vec3(0.0);
    for (int i = 0; i < LOOP; i++) {
      float slide = float(i) / float(LOOP) * 0.045;
      vec3 rR = refract(eye, n, 1.0 / uIorR);
      vec3 rY = refract(eye, n, 1.0 / uIorY);
      vec3 rG = refract(eye, n, 1.0 / uIorG);
      vec3 rC = refract(eye, n, 1.0 / uIorC);
      vec3 rB = refract(eye, n, 1.0 / uIorB);
      vec3 rP = refract(eye, n, 1.0 / uIorP);
      float r = texture2D(uTexture, uv + rR.xy * (uRefractPower + slide * 1.0) * uChromatic).x * 0.5;
      vec3 ty = texture2D(uTexture, uv + rY.xy * (uRefractPower + slide * 1.0) * uChromatic).rgb;
      float y = (ty.x * 2.0 + ty.y * 2.0 - ty.z) / 6.0;
      float g = texture2D(uTexture, uv + rG.xy * (uRefractPower + slide * 2.0) * uChromatic).y * 0.5;
      vec3 tc = texture2D(uTexture, uv + rC.xy * (uRefractPower + slide * 2.5) * uChromatic).rgb;
      float c = (tc.y * 2.0 + tc.z * 2.0 - tc.x) / 6.0;
      float b = texture2D(uTexture, uv + rB.xy * (uRefractPower + slide * 3.0) * uChromatic).z * 0.5;
      vec3 tp = texture2D(uTexture, uv + rP.xy * (uRefractPower + slide * 1.0) * uChromatic).rgb;
      float p = (tp.z * 2.0 + tp.x * 2.0 - tp.y) / 6.0;
      float R = r + (2.0 * p + 2.0 * y - c) / 3.0;
      float G = g + (2.0 * y + 2.0 * c - p) / 3.0;
      float B = b + (2.0 * c + 2.0 * p - y) / 3.0;
      color += vec3(R, G, B);
    }
    color /= float(LOOP);
    float luma = dot(color, vec3(0.2125, 0.7154, 0.0721));
    color = mix(vec3(luma), color, uSaturation);

    float spec = specular(uLight, uShininess, uDiffuseness, n, eye)
               + 0.6 * specular(vec3(1.0, 1.0, -1.0), uShininess * 0.6, uDiffuseness * 0.5, n, eye);
    color += spec * (uBackside > 0.5 ? 0.35 : 1.0);

    float f = pow(1.0 + dot(eye, n), uFresnelPower);
    color = mix(color, vec3(1.0), f * (uBackside > 0.5 ? 0.25 : 0.55));
    color += vec3(0.004, 0.005, 0.007);
    gl_FragColor = vec4(color, 1.0);
    #include <colorspace_fragment>
  }`;

function makeGlass(backside) {
  return new THREE.ShaderMaterial({
    vertexShader: glassVertex,
    fragmentShader: glassFragment,
    side: backside ? THREE.BackSide : THREE.FrontSide,
    uniforms: {
      uTexture: { value: null },
      uResolution: { value: new THREE.Vector2(1, 1) },
      uIorR: { value: 1.15 }, uIorY: { value: 1.16 }, uIorG: { value: 1.18 },
      uIorC: { value: 1.22 }, uIorB: { value: 1.22 }, uIorP: { value: 1.22 },
      uRefractPower: { value: backside ? 0.22 : 0.30 },
      uChromatic: { value: 0.5 },
      uSaturation: { value: 1.08 },
      uShininess: { value: 90 },
      uDiffuseness: { value: 0.02 },
      uFresnelPower: { value: 5.0 },
      uLight: { value: new THREE.Vector3(-1, 1, 1) },
      uBackside: { value: backside ? 1 : 0 }
    }
  });
}
const frontMat = makeGlass(false);
const backMat = makeGlass(true);

const rtOpts = { type: THREE.HalfFloatType };
const rtBack = new THREE.WebGLRenderTarget(1, 1, rtOpts);
const rtFront = new THREE.WebGLRenderTarget(1, 1, rtOpts);
backMat.uniforms.uTexture.value = rtBack.texture;
frontMat.uniforms.uTexture.value = rtFront.texture;

/* ---------------- model ---------------- */
let cube = null;
function fitGeometry(geometry) {
  geometry.computeBoundingBox();
  const box = geometry.boundingBox;
  const centre = new THREE.Vector3();
  const size = new THREE.Vector3();
  box.getCenter(centre);
  box.getSize(size);
  geometry.translate(-centre.x, -centre.y, -centre.z);
  const s = 1 / Math.max(size.x, size.y, size.z);
  geometry.scale(s, s, s);
  return geometry;
}
function installCube(geometry, source) {
  cube = new THREE.Mesh(geometry, frontMat);
  cube.frustumCulled = false;
  spinner.add(cube);
  canvas.dataset.model = source;
  loaderEl.classList.add('done');
}
new GLTFLoader().load(
  MODEL_URL,
  (gltf) => {
    gltf.scene.updateMatrixWorld(true);
    const parts = [];
    gltf.scene.traverse((obj) => {
      if (!obj.isMesh) return;
      let g = obj.geometry.clone();
      ['uv', 'uv1', 'uv2', 'color', 'tangent'].forEach((a) => { if (g.getAttribute(a)) g.deleteAttribute(a); });
      g = mergeVertices(g, 1e-4);
      g.computeVertexNormals();
      g.applyMatrix4(obj.matrixWorld);
      parts.push(g);
    });
    const merged = parts.length === 1 ? parts[0] : mergeGeometries(parts, false);
    if (!merged) throw new Error('empty model');
    installCube(fitGeometry(merged), 'glb');
  },
  undefined,
  () => installCube(fitGeometry(new RoundedBoxGeometry(1, 1, 1, 8, 0.12)), 'fallback')
);

/* ---------------- layout ---------------- */
function layout() {
  const W = innerWidth, H = innerHeight;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(W, H, false);
  camera.aspect = W / H;
  camera.updateProjectionMatrix();

  const dpr = renderer.getPixelRatio();
  const bw = Math.round(W * dpr), bh = Math.round(H * dpr);
  rtBack.setSize(bw, bh);
  rtFront.setSize(bw, bh);
  frontMat.uniforms.uResolution.value.set(bw, bh);
  backMat.uniforms.uResolution.value.set(bw, bh);

  drawHeadline();

  const mobile = isMobile();
  const visH = 2 * Math.tan(THREE.MathUtils.degToRad(FOV) / 2) * 10;
  const visW = visH * camera.aspect;
  const sx = mobile ? 0.5 : 0.517, sy = mobile ? 0.45 : 0.488;
  pivot.position.set((sx - 0.5) * visW, (0.5 - sy) * visH, 0);
  const px = Math.min(H * 0.44, W * (mobile ? 0.45 : 0.29));
  const s = (px / H) * visH;
  pivot.scale.setScalar(s);
}

/* ---------------- interaction ---------------- */
const Y_AXIS = new THREE.Vector3(0, 1, 0), X_AXIS = new THREE.Vector3(1, 0, 0);
const qTmp = new THREE.Quaternion();
function rotateWorld(ay, ax) {
  if (ay) { qTmp.setFromAxisAngle(Y_AXIS, ay); spinner.quaternion.premultiply(qTmp); }
  if (ax) { qTmp.setFromAxisAngle(X_AXIS, ax); spinner.quaternion.premultiply(qTmp); }
}

let dragging = false, lastX = 0, lastY = 0, lastMoveT = 0;
const vel = { x: 0, y: 0 };
let releaseT = performance.now() - 600;   // idle drift also runs from page load
let spinRemaining = 0;

canvas.addEventListener('pointerdown', (e) => {
  dragging = true;
  canvas.classList.add('dragging');
  canvas.setPointerCapture(e.pointerId);
  lastX = e.clientX; lastY = e.clientY; lastMoveT = performance.now();
  vel.x = 0; vel.y = 0;
  spinRemaining = 0;
});
canvas.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const now = performance.now();
  const dx = (e.clientX - lastX) * 0.008;
  const dy = (e.clientY - lastY) * 0.008;
  lastX = e.clientX; lastY = e.clientY;
  rotateWorld(dx, dy);
  const frames = Math.max(0.25, (now - lastMoveT) / 16.67);   // velocity per 16.67 ms frame
  vel.x = dx / frames; vel.y = dy / frames;
  lastMoveT = now;
});
function endDrag(e) {
  if (!dragging) return;
  dragging = false;
  canvas.classList.remove('dragging');
  try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
  if (performance.now() - lastMoveT > 80) { vel.x = 0; vel.y = 0; }   // held still before release
  releaseT = performance.now();
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

document.getElementById('prev').addEventListener('click', () => { vel.x = 0; vel.y = 0; spinRemaining -= Math.PI / 2; });
document.getElementById('next').addEventListener('click', () => { vel.x = 0; vel.y = 0; spinRemaining += Math.PI / 2; });

const dots = Array.from(document.querySelectorAll('.dot'));
dots.forEach((d) => d.addEventListener('click', () => dots.forEach((o) => o.classList.toggle('active', o === d))));

/* ---------------- render loop ---------------- */
let lastT = 0;
function frame(t) {
  const dt = Math.min(0.05, lastT ? (t - lastT) / 1000 : 1 / 60);
  lastT = t;
  const f = dt * 60;

  if (!dragging) {
    if (vel.x || vel.y) {
      rotateWorld(vel.x * f, vel.y * f);
      const damp = Math.pow(0.94, f);
      vel.x *= damp; vel.y *= damp;
      if (Math.abs(vel.x) < 1e-5 && Math.abs(vel.y) < 1e-5) { vel.x = 0; vel.y = 0; }
    }
    const since = (performance.now() - releaseT) / 1000;
    const blend = THREE.MathUtils.clamp((since - 0.6) / 1, 0, 1);
    if (blend > 0) rotateWorld(0.0035 * f * blend, 0.0012 * f * blend);
    if (spinRemaining) {
      const step = spinRemaining * Math.min(1, 0.09 * f);
      rotateWorld(step, 0);
      spinRemaining -= step;
      if (Math.abs(spinRemaining) < 0.0005) spinRemaining = 0;
    }
  }

  renderer.autoClear = true;
  renderer.setRenderTarget(rtBack);
  renderer.render(bgScene, camera);

  renderer.setRenderTarget(rtFront);
  renderer.render(bgScene, camera);
  if (cube) {
    renderer.autoClear = false;
    cube.material = backMat;
    renderer.render(scene, camera);
  }

  renderer.autoClear = true;
  renderer.setRenderTarget(null);
  renderer.render(bgScene, camera);
  if (cube) {
    renderer.autoClear = false;
    renderer.clearDepth();
    cube.material = frontMat;
    renderer.render(scene, camera);
  }
  renderer.autoClear = true;

  requestAnimationFrame(frame);
}

/* ---------------- boot ---------------- */
addEventListener('resize', layout);
if (document.fonts) document.fonts.addEventListener('loadingdone', drawHeadline);

Promise.race([
  Promise.all([document.fonts.load('800 100px Poppins'), document.fonts.ready]),
  new Promise((r) => setTimeout(r, 2500))
]).then(() => {
  layout();
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
