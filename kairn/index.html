<script>
(function () {
  var loop = document.getElementById('loop');
  var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduced) {
    var on = function () { loop.classList.add('on'); loop.play().catch(function () {}); };
    if (loop.readyState >= 2) on(); else loop.addEventListener('loadeddata', on, { once: true });
  }
  var hero = document.getElementById('hero'), burger = document.getElementById('burger'), nav = document.getElementById('nav');
  function setMenu(open) { hero.classList.toggle('menu-open', open); nav.classList.toggle('open', open); burger.setAttribute('aria-expanded', String(open)); burger.setAttribute('aria-label', open ? 'Close menu' : 'Open menu'); }
  burger.addEventListener('click', function () { setMenu(!hero.classList.contains('menu-open')); });
  nav.addEventListener('click', function (e) { if (e.target.closest('a')) setMenu(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setMenu(false); });
})();
</script>
