<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Planet Jumping</title>
<link rel="icon" href="data:,">
<style>
/* ===================== FONTS ===================== */
@font-face{font-family:'SF Pro';src:local('SF Pro Text Regular'),local('SFProText-Regular'),local('SF Pro Regular');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'SF Pro';src:local('SF Pro Text Bold'),local('SFProText-Bold'),local('SF Pro Bold');font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:'SF Pro Thin';src:local('SF Pro Display Thin'),local('SFProDisplay-Thin'),local('SF Pro Thin');font-weight:100;font-style:normal;font-display:swap}
@font-face{font-family:'Aalto';src:local('Aalto'),local('Aalto Regular');font-weight:400;font-style:normal;font-display:swap}

:root{font-family:'SF Pro',Arial,sans-serif;color:#fff;background:#090807;font-synthesis:none}

/* ===================== LAYOUT ===================== */
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
html,body,button,a,.portal{cursor:none!important}

.experience{position:relative;width:100%;height:100%;min-height:540px;overflow:hidden;background:#0a0908}
.backgrounds,.background,.shade,.transition-layer,.transition-layer video{position:absolute;inset:0;width:100%;height:100%}
.background{object-fit:cover;opacity:0;transition:opacity .8s ease}
.background.is-visible{opacity:1}
.shade{z-index:1;background:linear-gradient(to bottom,transparent 52%,rgba(0,0,0,.88) 100%);pointer-events:none}

.chrome{position:absolute;z-index:4;transition:opacity .45s ease,filter .45s ease}
.experience.is-transitioning .chrome{opacity:0;filter:blur(8px);pointer-events:none}

/* header */
.header{left:clamp(18px,1.95vw,28px);right:clamp(18px,1.95vw,28px);top:clamp(18px,3.1vh,28px);
  display:flex;justify-content:space-between;align-items:center}
.header-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.nav{display:flex;align-items:center;height:42px;padding:4px 5px;border:1px solid rgba(255,255,255,.45);
  background:rgba(255,255,255,.1);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:999px}
.nav a{color:#fff;text-decoration:none;padding:8px 19px;border-radius:999px;line-height:1}
.nav a.active{background:#fff;color:#000}
.menu{height:42px;padding:0 20px;border:0;border-radius:999px;background:#fff;color:#000;cursor:pointer}

/* sidebar */
.planet-list{left:clamp(18px,1.95vw,28px);top:50%;transform:translateY(-43%);
  display:flex;flex-direction:column;gap:6px;font-size:16px}
.planet-item{display:flex;align-items:center;min-height:20px}
.planet-item.active{font-size:18px;font-weight:700;gap:8px}
.planet-item.active:before{content:'';width:16px;height:16px;border-radius:50%;background:#fff}

/* portal */
.portal-wrap{left:50%;top:50%;width:min(320px,31vw);transform:translate(-50%,-54%);perspective:none}
.portal-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:16px;opacity:0}
.portal-heading strong{font-size:18px;margin-left:8px}
.portal{position:relative;display:block;width:100%;aspect-ratio:320/350;padding:0;overflow:visible;border:0;
  border-radius:90px;background:transparent;cursor:pointer;box-shadow:none;transform:none!important}
.portal video,.portal img{visibility:hidden;position:absolute;width:1px;height:1px;pointer-events:none}
.portal-canvas{position:fixed;inset:0;z-index:3;width:100%;height:100%;pointer-events:none}

/* content */
.planet-content{left:clamp(28px,4vw,58px);right:clamp(28px,3vw,44px);bottom:clamp(24px,3vh,30px);
  display:flex;justify-content:space-between;align-items:flex-end;gap:40px}
.planet-content h1{font-family:Aalto,'Arial Narrow',sans-serif;font-size:clamp(128px,21.8vw,314px);
  font-weight:400;line-height:.72;margin:0 0 -.04em;letter-spacing:0;transform:translateX(-32px);opacity:0}
.planet-content dl{width:min(447px,34vw);margin:0;font-size:16px}
.fact{display:grid;grid-template-columns:138px 1fr;gap:18px;padding:8px 0;
  border-bottom:1px solid rgba(255,255,255,.48);opacity:0}
.fact:last-child{border-bottom:0}
.fact dt{font-weight:700}
.fact dd{margin:0}

/* misc */
.transition-layer{display:none}
.scene-canvas{display:none}
.loading{position:absolute;z-index:12;left:50%;bottom:30px;transform:translateX(-50%);opacity:0;
  font-size:12px;letter-spacing:.14em;text-transform:uppercase;transition:opacity .2s}
.experience.is-loading .loading{opacity:.8}
.experience.is-transitioning .header,.experience.is-transitioning .planet-list{opacity:1;filter:none;pointer-events:auto}
.experience.is-transitioning .shade{opacity:1}
.experience.is-committing .background{transition:none!important}

/* ===================== PRELOADER ===================== */
.preloader{position:absolute;inset:0;z-index:20;background:#000;overflow:hidden}
.preloader video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.preloader-shade{position:absolute;inset:auto 0 0;height:35%;background:linear-gradient(to bottom,transparent,#000)}
.preloader.is-background{z-index:0}
.preloader.is-background .preloader-shade{opacity:0}

.floating-logo{position:fixed;z-index:22;left:50%;top:50%;width:59px;height:58px;transform:translate(-50%,-50%);
  transition:left 2s cubic-bezier(.16,1,.3,1),top 2s cubic-bezier(.16,1,.3,1),
             width 2s cubic-bezier(.16,1,.3,1),height 2s cubic-bezier(.16,1,.3,1),
             transform 2s cubic-bezier(.16,1,.3,1)}
/* will-change only while the logo is actually flying (see JS) */
.floating-logo.is-flying{will-change:left,top,width,height,transform}
.floating-logo.is-docked{left:clamp(18px,1.95vw,28px);top:clamp(18px,3.1vh,28px);width:37px;height:36px;transform:none}
.floating-logo.is-settled{z-index:5}

.preloader-count{position:fixed;z-index:22;left:50%;bottom:clamp(22px,3.1vh,28px);display:flex;align-items:flex-end;
  gap:4px;transform:translateX(-50%);font-family:'SF Pro',Arial,sans-serif;line-height:1}
.preloader-count>span:first-child{font-family:'SF Pro Thin','SF Pro',Arial,sans-serif;font-size:64px;font-weight:100}
.preloader-count .percent{font-size:24px;padding-bottom:4px}
.preloader-count.is-leaving{animation:preload-count-out .75s cubic-bezier(.22,1,.36,1) both}
@keyframes preload-count-out{to{opacity:0;filter:blur(7px);transform:translate(-50%,-34px)}}
body:not(.preload-complete) .custom-cursor{opacity:0!important}

/* ===================== CURSOR ===================== */
.custom-cursor{display:block;position:fixed;left:0;top:0;z-index:100;width:1px;height:1px;
  pointer-events:none;opacity:0;transition:opacity .2s ease}
.custom-cursor.is-visible{opacity:1}
.cursor-dot,.cursor-orbit{position:absolute;left:0;top:0;border-radius:50%}
.cursor-dot{width:12px;height:12px;margin:-6px 0 0 -6px;background:#fff;will-change:transform}
.cursor-orbit{width:36px;height:36px;margin:-18px 0 0 -18px;border:1px solid #fff;background:rgba(255,255,255,.4);
  will-change:transform;transition:scale .3s cubic-bezier(.22,1,.36,1)}
.custom-cursor.is-enter .cursor-orbit{scale:1.16}
.cursor-label{position:absolute;top:26px;left:0;margin-left:0;
  font:16px/1.2 'SF Pro',Arial,sans-serif;white-space:nowrap;opacity:0;translate:-50% -4px;
  will-change:transform;transition:opacity .2s ease,translate .3s cubic-bezier(.22,1,.36,1)}
.custom-cursor.is-enter .cursor-label{opacity:1;translate:-50% 0}

/* ===================== ENTRANCE / SWITCH ===================== */
body:not(.intro-ready) .header,
body:not(.intro-ready) .planet-list{opacity:0}
.intro-ready .header{animation:reveal-down .9s cubic-bezier(.22,1,.36,1) .1s both}
.intro-ready .planet-list{animation:reveal-side .9s cubic-bezier(.22,1,.36,1) .65s both}
.content-revealing .planet-content h1{animation:title-rise 1.05s cubic-bezier(.16,1,.3,1) both}
.content-revealing .fact{animation:fact-rise .72s cubic-bezier(.22,1,.36,1) both}
.content-revealing .fact:nth-child(1){animation-delay:.52s}
.content-revealing .fact:nth-child(2){animation-delay:.68s}
.content-revealing .fact:nth-child(3){animation-delay:.84s}
.content-revealing .fact:nth-child(4){animation-delay:1s}
.mask-revealing .portal-heading{animation:portal-caption .85s cubic-bezier(.22,1,.36,1) both}
.planet-list.is-switching .planet-item{animation:menu-row .58s cubic-bezier(.22,1,.36,1) both}
.planet-list.is-switching .planet-item:nth-child(1){animation-delay:.02s}
.planet-list.is-switching .planet-item:nth-child(2){animation-delay:.05s}
.planet-list.is-switching .planet-item:nth-child(3){animation-delay:.08s}
.planet-list.is-switching .planet-item:nth-child(4){animation-delay:.11s}
.planet-list.is-switching .planet-item:nth-child(5){animation-delay:.14s}
.planet-list.is-switching .planet-item:nth-child(6){animation-delay:.17s}
.planet-list.is-switching .planet-item:nth-child(7){animation-delay:.2s}
.planet-list.is-switching .planet-item:nth-child(8){animation-delay:.23s}
.planet-list.is-switching .planet-item.active:before{animation:active-dot .55s cubic-bezier(.22,1,.36,1) .18s both}

@keyframes reveal-down{from{opacity:0;filter:blur(8px);transform:translateY(-18px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}
@keyframes reveal-side{from{opacity:0;filter:blur(8px);transform:translate(-20px,-43%)}to{opacity:1;filter:blur(0);transform:translate(0,-43%)}}
@keyframes title-rise{from{opacity:0;filter:blur(12px);transform:translate(-32px,42px)}to{opacity:1;filter:blur(0);transform:translate(-32px,0)}}
@keyframes fact-rise{from{opacity:0;filter:blur(7px);transform:translateY(18px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}
@keyframes portal-caption{from{opacity:0;filter:blur(7px);transform:translateY(22px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}
@keyframes menu-row{from{opacity:.35;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
@keyframes active-dot{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}

/* ===================== RESPONSIVE ===================== */
@media(max-width:900px){
  .nav{display:none}
  .portal-wrap{width:min(300px,48vw)}
  .planet-content h1{font-size:clamp(105px,24vw,190px)}
  .planet-content dl{width:43vw}
  .fact{grid-template-columns:110px 1fr}
  .planet-list{font-size:14px}
  .planet-item.active{font-size:16px}
}
@media(max-width:640px){
  .experience{min-height:600px}
  .planet-list{display:none}
  .portal-wrap{top:44%;width:min(260px,66vw)}
  .planet-content{left:18px;right:18px;bottom:18px;display:block}
  .planet-content h1{font-size:clamp(98px,30vw,160px);margin-bottom:20px;transform:none}
  .planet-content dl{width:100%;font-size:13px}
  .fact{grid-template-columns:92px 1fr;padding:5px 0}
  .portal-heading{font-size:14px}
  .portal-heading strong{font-size:16px}
  .menu{height:38px}
  .portal{border-radius:70px}
}
@media(max-width:640px){
  .content-revealing .planet-content h1{animation-name:title-rise-mobile}
  @keyframes title-rise-mobile{from{opacity:0;filter:blur(12px);transform:translateY(42px)}to{opacity:1;filter:blur(0);transform:none}}
}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}.portal{transform:none!important}}
</style>
</head>

<script>
(function(){
'use strict';

/* ===================== assets ===================== */
var BASE='https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P';
var TO_EARTH=BASE+'/fc3ded42-e845-41f3-a830-5cab512d79cd.mp4';
var TO_VENUS=BASE+'/b30f64d9-1637-477a-83df-d0fc6461a422.mp4';
var MERCURY =BASE+'/d6fb8b6b-c15e-4aaa-9cf7-45bbb5e33372.jpg';

/* ===================== data ===================== */
var planets=['Mercury','Venus','Earth','Mars','Jupiter','Saturn','Uranus','Neptune'];

var states={
  mars:{name:'Mars',next:'Earth',number:'[03]',portal:TO_EARTH,background:'mars-background',
    facts:[['Distance:','About 228 million km (1.5 astronomical units).'],
           ['Year:','One Martian year is equal to 687 Earth days.'],
           ['Temperature:','Around -60 °C, dropping to -125 °C at the poles in winter.'],
           ['Atmosphere:','Very thin, consisting of 95% carbon dioxide, with frequent dust storms.']]},
  earth:{name:'Earth',next:'Venus',number:'[02]',portal:TO_VENUS,background:'earth-background',
    facts:[['Distance:','149.6 million km from the Sun.'],
           ['Year:','365.25 Earth days.'],
           ['Temperature:','Average surface temperature around 15 °C.'],
           ['Atmosphere:','Mostly nitrogen and oxygen, supporting life and liquid water.']]},
  venus:{name:'Venus',next:'Mercury',number:'[06]',image:MERCURY,background:'venus-background',
    facts:[['Distance:','108.2 million km from the Sun.'],
           ['Year:','225 Earth days.'],
           ['Temperature:','Around 465 °C — the hottest planet in the Solar System.'],
           ['Atmosphere:','Extremely dense, mostly carbon dioxide, with clouds of sulfuric acid.']]}
};

var current='mars';
var busy=false;

/* ===================== nodes ===================== */
var $=function(id){return document.getElementById(id);};
var experience=document.querySelector('.experience');
var planetList=document.querySelector('.planet-list');
var factsEl=$('facts');
var titleEl=$('planet-title');
var nextName=$('next-name');
var nextNumber=$('next-number');
var portal=$('portal');
var portalVideo=$('portal-video');
var portalImage=$('portal-image');
var transitionVideo=$('transition-video');
var canvas=$('portal-canvas');
var ctx=canvas.getContext('2d',{alpha:true});
var sceneCanvas=$('scene-canvas');
var sceneCtx=sceneCanvas.getContext('2d');
var preloader=$('preloader');
var preloaderVideo=$('preloader-video');
var preloaderCount=$('preloader-count');
var preloaderValue=$('preloader-value');
var logo=$('floating-logo');
var cursor=document.querySelector('.custom-cursor');

/* ===================== render state ===================== */
var expansion=0;          /* 0 = portal window, 1 = full screen */
var maskScale=0;          /* reveal scale of the window          */
var canvasOpacity=1;
var transitionActive=false;
var sceneFrozen=false;
var rotX=0,rotY=0,targetX=0,targetY=0;
var FOCAL=850;
var DPR_CAP=1.5;          /* 2 was needlessly heavy for video content */

/* --- the three things that make the loop cheap --- */
var dirty=true;           /* only paint when something actually changed */
var painting=false;       /* true while an animation is in flight       */
var portalRect=null;      /* cached: never measured inside the loop     */
var lastBox=null;         /* previous painted area, so we clear just it */

function markDirty(){dirty=true;}
function measurePortal(){
  var r=portal.getBoundingClientRect();
  portalRect={left:r.left,top:r.top,width:r.width,height:r.height};
  markDirty();
}

function resizeCanvas(){
  var d=Math.min(window.devicePixelRatio||1,DPR_CAP);
  canvas.width=Math.round(innerWidth*d);
  canvas.height=Math.round(innerHeight*d);
  canvas.style.width=innerWidth+'px';
  canvas.style.height=innerHeight+'px';
  ctx.setTransform(d,0,0,d,0,0);
  if(!sceneFrozen){
    sceneCanvas.width=Math.round(innerWidth*d);
    sceneCanvas.height=Math.round(innerHeight*d);
    sceneCanvas.style.width=innerWidth+'px';
    sceneCanvas.style.height=innerHeight+'px';
    sceneCtx.setTransform(d,0,0,d,0,0);
  }
  lastBox=null;
  measurePortal();
}

/* cover geometry, shared by the painter and the freeze step */
function coverRect(media){
  var mw=media?(media.videoWidth||media.naturalWidth||0):0;
  var mh=media?(media.videoHeight||media.naturalHeight||0):0;
  if(!mw||!mh) return null;
  var scale=Math.max(innerWidth/mw,innerHeight/mh);
  var w=mw*scale,h=mh*scale;
  return {x:(innerWidth-w)/2,y:(innerHeight-h)/2,w:w,h:h,scale:scale,mw:mw,mh:mh};
}

/* Draw ONLY the requested screen box, mapped back to source pixels, instead of
   blasting the whole viewport through the clip every frame. */
function drawCoverRegion(media,box,context){
  var c=context||ctx;
  var cr=coverRect(media);
  if(!cr) return;
  var bx=Math.max(0,box.x),by=Math.max(0,box.y);
  var bw=Math.min(innerWidth,box.x+box.w)-bx;
  var bh=Math.min(innerHeight,box.y+box.h)-by;
  if(bw<=0||bh<=0) return;
  var sx=(bx-cr.x)/cr.scale, sy=(by-cr.y)/cr.scale;
  var sw=bw/cr.scale, sh=bh/cr.scale;
  /* clamp to the source frame */
  if(sx<0){bw+=sx*cr.scale;bx-=sx*cr.scale;sx=0;}
  if(sy<0){bh+=sy*cr.scale;by-=sy*cr.scale;sy=0;}
  if(sx+sw>cr.mw){sw=cr.mw-sx;bw=sw*cr.scale;}
  if(sy+sh>cr.mh){sh=cr.mh-sy;bh=sh*cr.scale;}
  if(sw<=0||sh<=0||bw<=0||bh<=0) return;
  c.drawImage(media,sx,sy,sw,sh,bx,by,bw,bh);
}

function drawShadeRegion(c,box){
  var g=c.createLinearGradient(0,innerHeight*0.52,0,innerHeight);
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(1,'rgba(0,0,0,.88)');
  c.fillStyle=g;
  var y=Math.max(box.y,innerHeight*0.52);
  var h=Math.min(box.y+box.h,innerHeight)-y;
  if(h>0) c.fillRect(box.x,y,box.w,h);
}

/* rounded-rect outline sampled as ~44 points, local coords around the origin */
function maskPoints(w,h,r){
  r=Math.min(r,w/2,h/2);
  var corners=[
    [w/2-r,-h/2+r,-Math.PI/2,0],
    [w/2-r, h/2-r, 0,Math.PI/2],
    [-w/2+r,h/2-r, Math.PI/2,Math.PI],
    [-w/2+r,-h/2+r,Math.PI,Math.PI*1.5]
  ];
  var pts=[];
  for(var i=0;i<corners.length;i++){
    var c=corners[i];
    for(var s=0;s<=10;s++){
      var a=c[2]+(c[3]-c[2])*(s/10);
      pts.push([c[0]+Math.cos(a)*r,c[1]+Math.sin(a)*r]);
    }
  }
  return pts;
}

function project(x,y,rx,ry,cx,cy){
  var ax=rx*Math.PI/180,ay=ry*Math.PI/180;
  var xx=x*Math.cos(ay);
  var yy=y*Math.cos(ax);
  var z=x*Math.sin(ay)-y*Math.sin(ax);
  var p=FOCAL/(FOCAL+z);
  return [cx+xx*p,cy+yy*p];
}

function activeMedia(){
  if(transitionActive) return transitionVideo;
  return states[current].image?portalImage:portalVideo;
}

function paint(){
  var rect=portalRect||{left:0,top:0,width:0,height:0};
  var e=expansion;
  var rcx=rect.left+rect.width/2;
  var rcy=rect.top+rect.height/2;
  var cx=rcx+(innerWidth/2-rcx)*e;
  var cy=rcy+(innerHeight/2-rcy)*e;
  var baseW=rect.width+(innerWidth-rect.width)*e;
  var baseH=rect.height+(innerHeight-rect.height)*e;
  var scale=e?1:maskScale;
  var w=baseW*scale,h=baseH*scale;
  var r=90*(1-e)*scale;
  var rx=rotX*(1-e),ry=rotY*(1-e);

  /* clear only what was painted last time (plus the frozen backdrop, if any) */
  if(sceneFrozen){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    ctx.drawImage(sceneCanvas,0,0,innerWidth,innerHeight);
    drawShadeRegion(ctx,{x:0,y:0,w:innerWidth,h:innerHeight});
  }else if(lastBox){
    ctx.clearRect(lastBox.x,lastBox.y,lastBox.w,lastBox.h);
  }else{
    ctx.clearRect(0,0,innerWidth,innerHeight);
  }

  if(!(w>1&&h>1)){lastBox=null;return;}

  var pts=maskPoints(w,h,r);
  var minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  var screenPts=new Array(pts.length);
  for(var i=0;i<pts.length;i++){
    var p=project(pts[i][0],pts[i][1],rx,ry,cx,cy);
    screenPts[i]=p;
    if(p[0]<minX)minX=p[0]; if(p[0]>maxX)maxX=p[0];
    if(p[1]<minY)minY=p[1]; if(p[1]>maxY)maxY=p[1];
  }
  var box={x:Math.floor(minX)-2,y:Math.floor(minY)-2,
           w:Math.ceil(maxX-minX)+4,h:Math.ceil(maxY-minY)+4};

  ctx.save();
  ctx.globalAlpha=canvasOpacity;
  ctx.beginPath();
  for(var j=0;j<screenPts.length;j++){
    if(j) ctx.lineTo(screenPts[j][0],screenPts[j][1]);
    else ctx.moveTo(screenPts[j][0],screenPts[j][1]);
  }
  ctx.closePath();
  ctx.clip();
  ctx.fillStyle='#030303';
  ctx.fillRect(box.x,box.y,box.w,box.h);
  drawCoverRegion(activeMedia(),box);
  if(transitionActive) drawShadeRegion(ctx,box);
  ctx.restore();

  lastBox={x:box.x-1,y:box.y-1,w:box.w+2,h:box.h+2};
}

/* ---- video frames drive the repaints, not the display refresh rate ---- */
var frameHooks=[];
function hookVideoFrames(video){
  if(!video||!video.requestVideoFrameCallback) return;
  var token={cancelled:false};
  frameHooks.push(token);
  (function step(){
    if(token.cancelled) return;
    video.requestVideoFrameCallback(function(){
      if(token.cancelled) return;
      markDirty();
      step();
    });
  })();
}
function clearVideoHooks(){
  frameHooks.forEach(function(t){t.cancelled=true;});
  frameHooks=[];
}

/* ===================== single animation loop ===================== */
var pointer={x:innerWidth/2,y:innerHeight/2};
var orbit={x:innerWidth/2,y:innerHeight/2};
var cursorDot=cursor.querySelector('.cursor-dot');
var cursorOrbit=cursor.querySelector('.cursor-orbit');
var cursorLabel=cursor.querySelector('.cursor-label');
var cursorLive=false;
var sceneStarted=false;
var lastTs=0;
var wroteDot={x:-1e9,y:-1e9};
var wroteOrbit={x:-1e9,y:-1e9};

function loop(ts){
  var dt=lastTs?Math.min(40,ts-lastTs):16;
  lastTs=ts;

  /* --- cursor: transforms only, and nothing is written while it sits still,
         so a motionless pointer costs zero style recalcs --- */
  if(cursorLive){
    orbit.x+=(pointer.x-orbit.x)*0.2;
    orbit.y+=(pointer.y-orbit.y)*0.2;
    if(Math.abs(pointer.x-wroteDot.x)>0.05||Math.abs(pointer.y-wroteDot.y)>0.05){
      cursorDot.style.transform='translate3d('+pointer.x+'px,'+pointer.y+'px,0)';
      wroteDot.x=pointer.x;wroteDot.y=pointer.y;
    }
    if(Math.abs(orbit.x-wroteOrbit.x)>0.05||Math.abs(orbit.y-wroteOrbit.y)>0.05){
      var ot='translate3d('+orbit.x+'px,'+orbit.y+'px,0)';
      cursorOrbit.style.transform=ot;
      cursorLabel.style.transform=ot;
      wroteOrbit.x=orbit.x;wroteOrbit.y=orbit.y;
    }
  }

  /* --- tilt easing: only while it still has somewhere to go --- */
  if(Math.abs(targetX-rotX)>0.01||Math.abs(targetY-rotY)>0.01){
    var k=Math.min(1,dt*0.009);
    rotX+=(targetX-rotX)*k;
    rotY+=(targetY-rotY)*k;
    markDirty();
  }

  if(sceneStarted&&(dirty||painting)){
    dirty=false;
    paint();
  }
  requestAnimationFrame(loop);
}

/* ===================== render ===================== */
var rendered=false;
function render(){
  var s=states[current];
  experience.dataset.planet=current;
  titleEl.textContent=s.name.toUpperCase();
  nextName.textContent=s.next;
  nextNumber.textContent=s.number;
  portal.setAttribute('aria-label','Travel to '+s.next);

  factsEl.innerHTML='';
  s.facts.forEach(function(pair){
    var row=document.createElement('div');
    row.className='fact';
    var dt=document.createElement('dt');
    dt.textContent=pair[0];
    var dd=document.createElement('dd');
    dd.textContent=pair[1];
    row.appendChild(dt);
    row.appendChild(dd);
    factsEl.appendChild(row);
  });

  planetList.innerHTML='';
  planets.forEach(function(name){
    var item=document.createElement('span');
    item.className='planet-item'+(name===s.name?' active':'');
    item.textContent=name;
    planetList.appendChild(item);
  });
  if(rendered){
    planetList.classList.remove('is-switching');
    void planetList.offsetWidth;
    planetList.classList.add('is-switching');
  }

  var backgrounds=document.querySelectorAll('.background');
  for(var i=0;i<backgrounds.length;i++){
    backgrounds[i].classList.toggle('is-visible',backgrounds[i].id===s.background);
  }

  clearVideoHooks();
  if(s.image){
    portalImage.style.removeProperty('display');
    portalVideo.style.display='none';
    portalVideo.pause();           /* a still state must not keep a decoder busy */
  }else{
    portalImage.style.display='none';
    portalVideo.style.removeProperty('display');
    if(s.portal&&portalVideo.src!==s.portal){
      portalVideo.src=s.portal;
      portalVideo.load();
    }
    portalVideo.loop=true;
    if(document.body.classList.contains('preload-complete')) playPortal();
  }
  if(!transitionActive) hookVideoFrames(s.image?null:portalVideo);
  markDirty();
  rendered=true;
}

function playPortal(){
  if(states[current].image) return;
  var p=portalVideo.play();
  if(p&&p.catch) p.catch(function(){});
}

/* ===================== easing helpers ===================== */
function easeInOutCubic(t){
  return t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
}
function animateValue(setter,duration){
  return new Promise(function(resolve){
    var start=performance.now();
    painting=true;
    function step(now){
      var t=Math.min(1,(now-start)/duration);
      setter(easeInOutCubic(t));
      markDirty();
      if(t<1) requestAnimationFrame(step);
      else {painting=false;resolve();}
    }
    requestAnimationFrame(step);
  });
}
function retrigger(el,cls){
  el.classList.remove(cls);
  void el.offsetWidth;
  el.classList.add(cls);
}
function waitFor(media,events,timeout){
  return new Promise(function(resolve){
    var done=false;
    function finish(){
      if(done) return;
      done=true;
      events.forEach(function(name){media.removeEventListener(name,finish);});
      clearTimeout(timer);
      resolve();
    }
    if(media.tagName==='IMG'?media.complete:media.readyState>=3) return resolve();
    events.forEach(function(name){media.addEventListener(name,finish);});
    var timer=setTimeout(finish,timeout);
  });
}

/* ===================== reveals ===================== */
function revealMask(){
  retrigger(experience,'mask-revealing');
  maskScale=0;
  return animateValue(function(v){maskScale=v;},1050);
}
function revealPlanetContent(){
  retrigger(experience,'content-revealing');
}

/* ===================== travel ===================== */
function travel(){
  if(busy||current==='venus') return;
  busy=true;
  targetX=0;targetY=0;

  var next=current==='mars'?'earth':'venus';

  transitionVideo.src=states[current].portal;
  transitionVideo.load();
  experience.classList.add('is-loading');

  waitFor(transitionVideo,['canplaythrough','error'],1600).then(function(){
    experience.classList.remove('is-loading','content-revealing','mask-revealing');
    experience.classList.add('is-transitioning');
    transitionVideo.currentTime=0;
    transitionVideo.playbackRate=1.3;
    canvasOpacity=1;
    transitionActive=true;
    portalVideo.pause();            /* one decoder at a time */
    clearVideoHooks();
    hookVideoFrames(transitionVideo);
    markDirty();
    var p=transitionVideo.play();
    return (p&&p.then?p:Promise.resolve()).catch(function(){});
  }).then(function(){
    return animateValue(function(v){expansion=v;},1100);
  }).then(function(){
    return new Promise(function(resolve){
      if(transitionVideo.ended) return resolve();
      var done=false;
      function fin(){
        if(done) return;
        done=true;
        transitionVideo.removeEventListener('ended',fin);
        clearTimeout(t);
        resolve();
      }
      transitionVideo.addEventListener('ended',fin);
      var t=setTimeout(fin,Math.max(1000,((transitionVideo.duration||6)/1.3)*1000+1500));
    });
  }).then(function(){
    /* freeze the last frame so the swap underneath is invisible */
    sceneFrozen=true;
    sceneCtx.clearRect(0,0,innerWidth,innerHeight);
    drawCoverRegion(transitionVideo,{x:0,y:0,w:innerWidth,h:innerHeight},sceneCtx);

    current=next;
    experience.classList.add('is-committing');
    render();
    return new Promise(function(resolve){
      requestAnimationFrame(function(){requestAnimationFrame(resolve);});
    });
  }).then(function(){
    transitionActive=false;
    expansion=0;
    maskScale=0;
    canvasOpacity=1;
    clearVideoHooks();
    playPortal();
    hookVideoFrames(states[current].image?null:portalVideo);
    experience.classList.remove('is-transitioning','is-committing');
    var maskReveal=revealMask();
    setTimeout(revealPlanetContent,100);
    return maskReveal;
  }).then(function(){
    sceneFrozen=false;
    resizeCanvas();
    setTimeout(function(){
      transitionVideo.removeAttribute('src');
      transitionVideo.load();
      busy=false;
    },450);
  }).catch(function(){
    transitionActive=false;
    expansion=0;
    maskScale=1;
    canvasOpacity=1;
    sceneFrozen=false;
    experience.classList.remove('is-loading','is-transitioning','is-committing');
    markDirty();
    busy=false;
  });
}

portal.addEventListener('click',travel);

/* ===================== pointer ===================== */
addEventListener('pointermove',function(e){
  pointer.x=e.clientX;
  pointer.y=e.clientY;
  if(!cursorLive){
    cursorLive=true;
    orbit.x=e.clientX;orbit.y=e.clientY;
    cursor.classList.add('is-visible');
  }
  if(!busy){
    targetY=(e.clientX/innerWidth-0.5)*37.4;
    targetX=(e.clientY/innerHeight-0.5)*-33;
  }
},{passive:true});
addEventListener('pointerleave',function(){targetX=0;targetY=0;});
document.addEventListener('mouseleave',function(){cursor.classList.remove('is-visible');});
portal.addEventListener('pointerenter',function(){cursor.classList.add('is-enter');});
portal.addEventListener('pointerleave',function(){cursor.classList.remove('is-enter');});

/* ===================== preloader ===================== */
function startExperience(){
  sceneStarted=true;
  playPortal();
  clearVideoHooks();
  hookVideoFrames(states[current].image?null:portalVideo);
  var media=states[current].image?portalImage:portalVideo;
  waitFor(media,['canplaythrough','loadeddata','error'],1600).then(function(){
    measurePortal();
    return revealMask();
  }).then(function(){
    document.body.classList.add('intro-ready');
    setTimeout(revealPlanetContent,850);
  });
}

function runPreloader(){
  var finished=false;
  function finish(){
    if(finished) return;
    finished=true;
    preloaderValue.textContent='100';
    preloaderCount.classList.add('is-leaving');
    logo.classList.add('is-docked');
    preloader.classList.add('is-background');
    document.body.classList.add('preload-complete');
    startExperience();
    setTimeout(function(){
      if(preloaderCount.parentNode) preloaderCount.parentNode.removeChild(preloaderCount);
    },750);
    setTimeout(function(){
      logo.classList.add('is-settled');
      logo.classList.remove('is-flying');   /* drop will-change once it has landed */
    },2000);
  }

  function tick(){
    if(finished) return;
    var d=preloaderVideo.duration;
    if(d&&isFinite(d)){
      preloaderValue.textContent=String(Math.round(preloaderVideo.currentTime/d*100));
    }
    requestAnimationFrame(tick);
  }

  function begin(){
    var d=preloaderVideo.duration;
    if(d&&isFinite(d)) preloaderVideo.playbackRate=Math.max(0.25,d/3);
    var p=preloaderVideo.play();
    if(p&&p.catch) p.catch(function(){finish();});
    requestAnimationFrame(tick);
  }

  preloaderVideo.addEventListener('ended',finish);
  if(preloaderVideo.readyState>=1) begin();
  else preloaderVideo.addEventListener('loadedmetadata',begin,{once:true});
  setTimeout(finish,12000);
}

/* ===================== boot ===================== */
var resizeTimer=0;
addEventListener('resize',function(){
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(resizeCanvas,80);   /* one resize, not one per pixel */
},{passive:true});

var bgVideos=document.querySelectorAll('.background');
for(var b=0;b<bgVideos.length;b++){
  bgVideos[b].pause();
  try{bgVideos[b].currentTime=0;}catch(e){}
}
resizeCanvas();
render();
requestAnimationFrame(loop);
runPreloader();

})();
</script>
</body>
