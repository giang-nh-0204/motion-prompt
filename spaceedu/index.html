/* ============ B) TABLET ============ */

/* ============ ENTRANCE ANIMATION ============ */
@keyframes ent-reveal{from{transform:translateY(115%)}to{transform:translateY(0)}}
@keyframes ent-rise{from{opacity:0;transform:translateY(var(--rise,10px))}to{opacity:1;transform:none}}
@keyframes ent-settle{from{opacity:0;transform:translateY(var(--rise,8px)) scale(.965)}to{opacity:1;transform:none}}
@keyframes ent-draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes ent-fade{from{opacity:0}to{opacity:1}}

.anim{--e-expo:cubic-bezier(.16,1,.3,1); --e-quint:cubic-bezier(.22,1,.36,1);
      --e-slow:cubic-bezier(.4,0,.2,1)}
.ent-mask,.ent-line{display:block}
.anim .ent-mask{overflow:hidden; padding-top:.18em; margin-top:-.18em}
.anim .ent-line{transform:translateY(115%); will-change:transform}
.anim .navbar::after,.anim .links a[aria-current="page"]::after,.anim .rule span{transform:scaleX(0)}
.anim .logo,.anim .links a,.anim .burger,.anim p.lede,.anim .label,.anim .cta a,
.anim .scroll,.anim .sky{opacity:0}
.anim .sky{will-change:opacity}

.anim.play .sky{animation:ent-fade 1.6s var(--e-slow) .25s both}
.anim.play .navbar::after{animation:ent-draw .9s var(--e-expo) .12s both}
.anim.play .logo{--rise:calc(8 * var(--u)); animation:ent-rise .6s var(--e-quint) .20s both}

.anim.play .links a.enroll,
.anim.play .burger{--rise:calc(8 * var(--u)); animation:ent-settle .6s var(--e-quint) .46s both}
.anim.play .links a[aria-current="page"]::after{animation:ent-draw .55s var(--e-expo) .60s both}
.anim.play .eyebrow .ent-line{animation:ent-reveal .75s var(--e-expo) .30s both}

        <a class="logo" href="#">space<i>edu</i></a>

          <a href="#" aria-current="page">Planets</a>

                aria-expanded="false" aria-controls="site-nav">

    <div class="copy">
      <div class="col eyebrow"><span class="ent-mask"><span class="ent-line">PLANET</span></span></div>
      <h1 class="col title"><span class="ent-mask"><span class="ent-line">EARTH</span></span></h1>
      <div class="col rule"><span></span></div>
      <p class="col lede">Learn more about the fascinating details that we call our home, Planet Earth. Course enrollment <br>starts today. Early Bird tickets typically last a week, don&rsquo;t miss out!</p>
      <div class="col cta">
        <button class="planet planet-l" type="button" data-slot="l">
          <img data-planet="earth" alt="" src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202005_3346cc4d-ec3b-44ab-825c-b18e49f5021a.png">
          <img data-planet="venus" alt="" src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202012_640b239a-d08a-4200-adb2-741bbe129ac8.png">
          <img data-planet="mars" alt="" src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202018_3d559490-f613-4ed7-a3bb-3b7e9fc90fb8.png">
        </button>
        <button class="planet planet-r" type="button" data-slot="r">
          <img data-planet="earth" alt="" src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202005_3346cc4d-ec3b-44ab-825c-b18e49f5021a.png">
          <img data-planet="venus" alt="" src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202012_640b239a-d08a-4200-adb2-741bbe129ac8.png">
          <img data-planet="mars" alt="" src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202018_3d559490-f613-4ed7-a3bb-3b7e9fc90fb8.png">

<script>
(function(){
  'use strict';

  /* ---------------- ENTRANCE DRIVER ---------------- */
  (function(){
    var root = document.documentElement;
    if(!root.classList.contains('anim')) return;
    var started = false;
    function start(){
      if(started) return;
      started = true;
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          root.classList.add('play');
          /* Once the sequence has played, drop both classes so the page is left
             in its authored static state — no timers, no residual transforms. */
          setTimeout(function(){
            root.classList.remove('anim');
            root.classList.remove('play');
          }, 2150);
        });
      });
    }
    var guard = setTimeout(start, 500);   /* a font stall must not block the page */
    if(document.fonts && document.fonts.ready && document.fonts.ready.then){
      document.fonts.ready.then(function(){ clearTimeout(guard); start(); },
                               function(){ clearTimeout(guard); start(); });
    } else {
      clearTimeout(guard);
      start();
    }
  })();

  /* ---------------- PLANET SWITCHER ---------------- */
  var ORDER = ['earth','venus','mars'];
  var TAIL = 'Course enrollment <br>starts today. Early Bird tickets typically last a week, don&rsquo;t miss out!';
  var DATA = {
    earth:{
      name:'EARTH',
      cutout:'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202005_3346cc4d-ec3b-44ab-825c-b18e49f5021a.png',
      still:'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202133_508c64b8-a31e-4290-bdfc-1187df70e0a6.png',
      lede:'Learn more about the fascinating details that we call our home, Planet Earth. ' + TAIL
    },
    venus:{
      name:'VENUS',
      cutout:'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202012_640b239a-d08a-4200-adb2-741bbe129ac8.png',
      still:'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202133_cf55d1d8-7b59-4a64-80da-d72052ae974e.png',
      lede:'The hottest world in our solar system, wrapped in clouds of sulfuric acid. ' + TAIL
    },
    mars:{
      name:'MARS',
      cutout:'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202018_3d559490-f613-4ed7-a3bb-3b7e9fc90fb8.png',
      still:'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202133_0ba6de7c-285d-43dc-b7ab-8c54c73707cb.png',
      lede:'The rust-red desert world, home to the tallest volcano we know of. ' + TAIL
    }
  };

  var sky     = document.querySelector('.sky');
  var clips   = [].slice.call(document.querySelectorAll('.sky video'));
  var titleLn = document.querySelector('h1.title .ent-line');
  var lede    = document.querySelector('p.lede');
  var slots   = { l:document.querySelector('.planet-l'), r:document.querySelector('.planet-r') };
  var labels  = { l:document.querySelector('.label-l'),  r:document.querySelector('.label-r') };
  var current = null;

  function clipOf(planet){
    for(var i = 0; i < clips.length; i++){
      if(clips[i].dataset.planet === planet) return clips[i];
    }
    return null;
  }

  /* Start the fetch on intent rather than on click. */
  function warm(planet){
    var v = clipOf(planet);
    if(!v || v.getAttribute('src') || !v.dataset.src) return;
    v.preload = 'auto';
    v.src = v.dataset.src;
    v.load();
  }

  function show(next){
    if(!DATA[next] || next === current) return;
    current = next;

    clips.forEach(function(v){
      if(v.dataset.planet === next){
        if(!v.getAttribute('src') && v.dataset.src){ v.src = v.dataset.src; }
        v.classList.add('is-active');
        var p = v.play();
        if(p && p.catch) p.catch(function(){});
      } else {
        v.classList.remove('is-active');
        v.pause();
      }
    });

    /* Keeps reduced-motion visitors, who never see a clip, on the right planet. */
    sky.style.backgroundImage = 'url("' + DATA[next].still + '")';
    titleLn.textContent = DATA[next].name;
    lede.innerHTML = DATA[next].lede;

    var rest = ORDER.filter(function(p){ return p !== next; });
    [['l', rest[0]], ['r', rest[1]]].forEach(function(pair){
      var key = pair[0], planet = pair[1], btn = slots[key];
      /* Reveal by class only. Reassigning img.src would keep the previous planet
         painted until the new 2048px file finished downloading. */
      [].forEach.call(btn.querySelectorAll('img'), function(img){
        img.classList.toggle('is-shown', img.dataset.planet === planet);
      });
      btn.dataset.planet = planet;
      btn.setAttribute('aria-label', 'Show ' + DATA[planet].name);
      labels[key].textContent = DATA[planet].name;
    });
  }

  ['l','r'].forEach(function(key){
    var btn = slots[key];
    btn.addEventListener('click', function(){ show(this.dataset.planet); });
    btn.addEventListener('pointerenter', function(){ warm(this.dataset.planet); });
    btn.addEventListener('focus', function(){ warm(this.dataset.planet); });
  });

  show('earth');

  function warmAll(){ ORDER.forEach(warm); }
  requestAnimationFrame(function(){
    if(window.requestIdleCallback) requestIdleCallback(warmAll, { timeout:4000 });
    else setTimeout(warmAll, 2500);
  });

  /* ---------------- BURGER MENU ---------------- */
  var navrow  = document.querySelector('.navrow');
  var burger  = document.querySelector('.burger');
  var navmenu = document.getElementById('site-nav');

  function set(open){
    navrow.dataset.open = open ? 'true' : 'false';
    burger.setAttribute('aria-expanded', open ? 'true' : 'false');
    burger.setAttribute('aria-label', open ? 'Close navigation' : 'Open navigation');
  }
  set(false);

  burger.addEventListener('click', function(e){
    e.stopPropagation();
    set(navrow.dataset.open !== 'true');
  });
  document.addEventListener('click', function(e){
    if(navrow.dataset.open !== 'true') return;
    if(navmenu.contains(e.target) || burger.contains(e.target)) return;
    set(false);
  });
  document.addEventListener('keydown', function(e){
    if((e.key === 'Escape' || e.key === 'Esc') && navrow.dataset.open === 'true'){
      set(false);
      burger.focus();
    }
  });
  navmenu.addEventListener('click', function(e){
    if(e.target && e.target.closest && e.target.closest('a')) set(false);
  });
})();
</script>
